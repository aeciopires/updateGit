name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      # Actions pinned by commit SHA (the comment shows the version)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not keep the GitHub token in .git/config (not needed after the checkout)
          persist-credentials: false

      - name: Install tools (versions from mise.toml)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Cache trivy database
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-${{ runner.os }}-

      - name: Fast checks (format, modules, vet, lint, tests)
        if: runner.os != 'Linux'
        run: make check

      - name: All checks (coverage, vulnerabilities, workflows, build and artifacts)
        if: runner.os == 'Linux'
        run: make check-all

      - name: Coverage report
        if: runner.os == 'Linux' && always()
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: coverage.html
          if-no-files-found: ignore
