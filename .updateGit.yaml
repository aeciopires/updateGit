# Precedence: flags > environment variables (CLI_*) > this file > defaults

# Git settings
git:
  # Base directory for git repositories
  base_dir: "./git_repos"
  # Enable parallel processing of git repositories
  parallel_enabled: true
  # Maximum number of concurrent git repository updates (1-100)
  max_concurrent: 5
  # Timeout (in seconds) for each "git pull"
  timeout: 300
  # Directory levels searched for repositories: 1 (only base_dir children) to 6 (maximum). Default: 2.
  # The search never goes into a directory that is already a git repository.
  max_depth: 2
  # Directory names ignored by the search
  exclude_dirs:
    - "node_modules"
    - "vendor"
    - ".terraform"
    - ".venv"
  # Skip repositories with files not committed in the current branch (avoids losing work)
  skip_dirty: true

# Backup settings
backup:
  # Enable backup before updates (default false: backups use disk space)
  enabled: false
  # Backup directory (relative or absolute path)
  directory: "./git_backups"
  # Backup strategy: "copy" or "stash"
  strategy: "copy"
  # Maximum number of simultaneous backups (1-100, independent of git.max_concurrent)
  max_concurrent: 4

# Repository filtering
filter:
  # Repositories to skip: directory name (e.g. "broken-repo") or path relative
  # to git.base_dir (e.g. "github/broken-repo")
  skip_repos:
    - "old-project"
    - "experimental-stuff"
    - "broken-repo"

# Log and output settings
log:
  # Minimum log level: debug, info, warning, error
  level: "info"
  # Colored output: auto (only in a terminal and without NO_COLOR), always, never
  color: "auto"
  # Live progress bar: auto (only in a terminal with more than one worker), always, never
  progress: "auto"
  file:
    # Save the log to <directory>/updateGit_YYYY-MM-DD_HH-MM-SS.log (permission 0600)
    enabled: false
    directory: "/tmp"
    # Minimum log level saved in the file. Empty = same as log.level
    level: ""

